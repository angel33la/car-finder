<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheets">
<link rel="stylesheets" href="index.scss">
</head>
<body>
  <div class="container">
    <header>
      <h1>Find Your Dream Vehicle</h1>
        <p>Have you been dreaming about getting a new vehicle?</p>
        <p>Well you are in luck.</p>
    </header>
    <main class="car-finder">
      <div id="car-form" class="search-controls">
        <div class="select-group">
        <label for="year" class="label">Year</label>
        <select id="year" name="year" class="select" placeholder="Select Year">
        <option value="">Select Year</option>
        <!-- Options will be populated dynamically -->
          </select>
        </div>
        <div class="select-group">
        <label for="make" class="label">Make</label>
        <select id="make" name="make" class="select" placeholder="Select Make">
        <option value="">Select Make</option>
        <!-- Options will be populated dynamically -->  
        </select>
        </div>
        <div class="select-group">
      <label for="model" class="label">Model</label>
      <select id="model" name="model" class="select" placeholder="Select Model">
        <option value="">Select Model</option>
        <!-- Options will be populated dynamically -->
      </select>
      </div>
    </div>
    
  </main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
