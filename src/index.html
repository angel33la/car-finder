<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheets">
</head>
<body>
  <div class="container">
    <header>
      <h1>Find Your Dream Vehicle</h1>
        <p>Have you been dreaming about getting a new vehicle?</p>
        <p>Well you are in luck.</p>
    </header>
    <main class="car-finder">
      <form id="car-form" class="search-controls">
        <div class="select-group">
        <label for="year">Year</label>
        <select id="year" name="year">
        <option value="">Select Year</option>
        <!-- Options will be populated dynamically -->
        </select>
        <label for="make">Make</label>
        <select id="make" name="make" >
        <option value="">Select Make</option>
        <!-- Options will be populated dynamically -->  
        </select>
      <label for="model">Model</label>
      <select id="model" name="model" >
        <option value="">Select Model</option>
        <!-- Options will be populated dynamically -->
      </select>
      </div>
    </form>
    
  </main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
