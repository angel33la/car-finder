<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">

<body>
  <div class="container">
    <header>
      <h1>Find Your Dream Vehicle</h1>
        <p>Have you been dreaming about getting a new vehicle?</p>
        <p>Well you are in luck.</p>
    </header>
    <main class="car-finder">
      <form id="car-form" class="search-controls">
        <div class="select-group">
        <label for="year" class="label">Year</label>
        <select id="year" name="year" class="select" placeholder="Select Year">
        <option value="">Select Year</option>
        <!-- Options will be populated dynamically -->
          <svg size="18" color="darkBrightBlue" x="0px" y="0px" viewBox="0 0 64 64" class="css-1fx2uzn-StyledIcon e1vcxgeb0"><g><defs><polygon points="-507,-1597.791 -508.209,-1599 -513,-1594.209 -517.791,-1599 -519,-1597.791 -514.209,-1593 -519,-1588.209 -517.791,-1587 -513,-1591.791 -508.209,-1587 -507,-1588.209 -511.791,-1593 		"></polygon></defs><g><defs><rect x="-688" y="-3317" width="1440" height="6698"></rect></defs></g></g><g><polyline fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="56.976,22.03 31.414,47.592 5.852,22.03 	"></polyline></g></svg>
          </select>
        </div>
        <div class="select-group">
        <label for="make" class="label">Make</label>
        <select id="make" name="make" class="select" placeholder="Select Make">
        <option value="">Select Make</option>
        <!-- Options will be populated dynamically -->  
        <svg size="18" color="darkBrightBlue" x="0px" y="0px" viewBox="0 0 64 64" class="css-1fx2uzn-StyledIcon e1vcxgeb0"><g><defs><polygon points="-507,-1597.791 -508.209,-1599 -513,-1594.209 -517.791,-1599 -519,-1597.791 -514.209,-1593 -519,-1588.209 -517.791,-1587 -513,-1591.791 -508.209,-1587 -507,-1588.209 -511.791,-1593 		"></polygon></defs><g><defs><rect x="-688" y="-3317" width="1440" height="6698"></rect></defs></g></g><g><polyline fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="56.976,22.03 31.414,47.592 5.852,22.03 	"></polyline></g></svg>
        </select>
        </div>
        <div class="select-group">
      <label for="model" class="label">Model</label>
      <select id="model" name="model" class="select" placeholder="Select Model">
        <option value="">Select Model</option>
        <!-- Options will be populated dynamically -->
        <svg size="18" color="darkBrightBlue" x="0px" y="0px" viewBox="0 0 64 64" class="css-1fx2uzn-StyledIcon e1vcxgeb0"><g><defs><polygon points="-507,-1597.791 -508.209,-1599 -513,-1594.209 -517.791,-1599 -519,-1597.791 -514.209,-1593 -519,-1588.209 -517.791,-1587 -513,-1591.791 -508.209,-1587 -507,-1588.209 -511.791,-1593 		"></polygon></defs><g><defs><rect x="-688" y="-3317" width="1440" height="6698"></rect></defs></g></g><g><polyline fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="56.976,22.03 31.414,47.592 5.852,22.03 	"></polyline></g></svg>
      </select>
      </div>
    </form>
    
  </main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
